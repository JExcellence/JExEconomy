name: JExEconomy
version: '3.2.0'
main: de.jexcellence.economy.JExEconomyPlugin
description: Multi-currency economy system
api-version: '1.21'
author: JExcellence
website: https://jexcellence.de
loader: de.jexcellence.dependency.loader.PaperPluginLoader
# Open so JExQuests + other ecosystem plugins can reach jexeconomy-api
# (EconomyProvider, CurrencySnapshot) via join-classpath dependencies.
# Also required for the bundled Vault API to be visible to consumers.
has-open-classloader: true
# Bundles the Vault API (net.milkbowl.vault.economy.*) and registers as
# a Vault provider. `provides: [Vault]` satisfies softdepend:[Vault], so a
# separate Vault.jar is not required. With a separate Vault or VaultUnlocked
# jar, JExEconomy registers with it and logs that the jar can be removed.
provides: [Vault]
prefix: JExcellence
folia-supported: true
dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    # Soft: Bedrock players get Cumulus forms instead of the chest GUIs.
    floodgate:
      load: BEFORE
      required: false
      join-classpath: true

# Permission nodes live under jexeconomy.*; the old nodes stay as aliases for now.
# Each old node grants its new node as a child, see docs/PERMISSIONS.md.
permissions:
  jexeconomy.*:
    description: Every JExEconomy permission
    default: op
    children:
      jexeconomy.balance: true
      jexeconomy.balance.other: true
      jexeconomy.balance.top: true
      jexeconomy.pay: true
      jexeconomy.currencylog: true
      jexeconomy.currencylog.player: true
      jexeconomy.currencylog.clear: true
      jexeconomy.currencies: true
      jexeconomy.currencies.overview: true
      jexeconomy.currencies.create: true
      jexeconomy.currencies.edit: true
      jexeconomy.currencies.delete: true
      jexeconomy.currencies.reset: true
      jexeconomy.admin: true
      jexeconomy.admin.give: true
      jexeconomy.admin.take: true
      jexeconomy.admin.set: true
      jexeconomy.admin.reset-player: true
      jexeconomy.admin.giveall: true
      jexeconomy.admin.migrate: true
      jexeconomy.admin.reload: true
      jexeconomy.coupon: true
      jexeconomy.coupon.give: true
      jexeconomy.coupon.list: true
      jexeconomy.coupon.reload: true
      jexeconomy.coupon.history: true
  jexeconomy.admin.*:
    description: Every administrative JExEconomy permission, including the currency manager
    default: op
    children:
      jexeconomy.balance.other: true
      jexeconomy.currencylog.player: true
      jexeconomy.currencylog.clear: true
      jexeconomy.currencies: true
      jexeconomy.currencies.overview: true
      jexeconomy.currencies.create: true
      jexeconomy.currencies.edit: true
      jexeconomy.currencies.delete: true
      jexeconomy.currencies.reset: true
      jexeconomy.admin: true
      jexeconomy.admin.give: true
      jexeconomy.admin.take: true
      jexeconomy.admin.set: true
      jexeconomy.admin.reset-player: true
      jexeconomy.admin.giveall: true
      jexeconomy.admin.migrate: true
      jexeconomy.admin.reload: true
  jexeconomy.coupon.*:
    description: Every coupon permission
    default: op
    children:
      jexeconomy.coupon: true
      jexeconomy.coupon.give: true
      jexeconomy.coupon.list: true
      jexeconomy.coupon.reload: true
      jexeconomy.coupon.history: true
