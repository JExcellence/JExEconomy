# ─── JExEconomy ─ Deutsch (DE) ───────────────────────────────────────────────
# MiniMessage-Format | {placeholder}-Syntax. Live-Dateien werden nie neu erzeugt: geänderte Texte bekommen
# neue versionierte Schlüssel (economy-v2.*), die beim Merge in bestehende Dateien kommen.

prefix: "<gradient:#FBBF24:#F59E0B>Schatzkammer</gradient> <dark_gray>»</dark_gray> "

# ── JExCommand framework and argument-type keys (fixed names) ─────────────────

jexcommand:
  usage: "<gray>Benutzung: <white>{usage}</white>"
  error:
    missing-argument: "<red>Fehlendes Argument <gold>{name}</gold> <dark_gray>(<gray>{type}</gray>)</dark_gray>."
    too-many-arguments: "<red>Zu viele Argumente."
    unknown-subcommand: "<red>Unbekannter Unterbefehl <gold>{name}</gold>."
    ambiguous-subcommand: "<red><gold>{name}</gold> passt zu mehreren Unterbefehlen: <gold>{choices}</gold>. Klicke einen an oder tippe weiter.</red>"
    no-permission: "<red>Keine Berechtigung. <dark_gray>(<gray>{permission}</gray>)</dark_gray>"
    not-a-player: "<red>Dieser Befehl kann nur von einem Spieler ausgeführt werden."
    not-a-console: "<red>Dieser Befehl kann nur von der Konsole ausgeführt werden."
    player-only: "<red>Dieser Befehl kann nur von einem Spieler ausgeführt werden."
    console-only: "<red>Dieser Befehl kann nur von der Konsole ausgeführt werden."
    unknown-type: "<red>Unbekannter Argumenttyp <gold>{type}</gold>."
    internal: "<red>Interner Fehler: <white>{message}</white>"
    invalid-long: "<red><white>{value}</white> ist keine gültige Ganzzahl."
    invalid-double: "<red><white>{value}</white> ist keine gültige Zahl."
    not-positive-long: "<red><white>{value}</white> muss eine positive Ganzzahl sein."
    not-positive-double: "<red><white>{value}</white> muss eine positive Zahl sein."
    player-not-online: "<red>Spieler <white>{value}</white> ist nicht online."
    player-unknown: "<red>Spieler <white>{value}</white> war noch nie auf diesem Server."
    invalid-enum: "<red><white>{value}</white> ist nicht gültig: <gray>{options}</gray>."
    invalid-uuid: "<red><white>{value}</white> ist keine gültige UUID."
    expected-single-word: "<red>Erwarte ein einzelnes Wort ohne Leerzeichen."

# ── /economy Admin-Befehl ────────────────────────────────────────────────────

economy:
  error:
    currency-not-found: "<red>Währung <gold>{currency}</gold> nicht gefunden."

coupon:
  error:
    template-not-found: "<red>Keine Coupon-Vorlage namens <white>{template}</white>."

# ── Zweite Generation (Menüs, Panels, Chatzeilen) ────────────────────────────
# Chat-Panels setzt der gemeinsame ChatPanel-Renderer; die Zeilen hier liefern nur Text und Farbe.

