# JExCommand 2.0 tree - /balance
# View your own or another player's balances, plus a currency leaderboard.

name: balance
description: "Show currency balances"
aliases:
  - money
  - bal
  - wallet
  - pcurrency
permission: "jexeconomy.balance"
# Player-safe: every player can check balances by default (op-only otherwise).
default: true
senders: [player]
argumentSchema:
  - { name: currency, type: currency,      required: false, description: "Currency id (omit for every balance; the names all, top and help are subcommands)" }
  - { name: player,   type: offline_player, required: false, description: "Player to inspect (requires jexeconomy.balance.other)" }

subcommands:
  - name: all
    description: "List every currency balance"
    senders: [player]
    argumentSchema:
      - { name: player, type: offline_player, required: false, description: "Player to inspect" }

  - name: top
    description: "Show the top holders of a currency"
    permission: "jexeconomy.balance.top"
    default: true
    senders: [player]
    argumentSchema:
      - { name: currency, type: currency,      required: false, description: "Currency id (defaults to primary)" }
      - { name: limit,    type: positive_long, required: false, defaultValue: "10", description: "Rows to display, 1..50" }

  - name: help
    description: "Show /balance usage"
    senders: [player]
